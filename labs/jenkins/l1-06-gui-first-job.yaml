# ──────────────────────────────────────────────────────────────────────────────
# Jenkins Lab: Your First Jenkins Job (GUI)
# Real Jenkins LTS instance — student interacts via the embedded UI tab.
# ──────────────────────────────────────────────────────────────────────────────

id: "jenkins-gui-first-job"
title: "Your First Jenkins Job (GUI)"
track: "jenkins"
level: 1
category: "Jenkins Fundamentals"
difficulty: "beginner"
summary: "Log into a live Jenkins server, create a freestyle project through the GUI, add a shell build step, and run your first successful build."
estimatedMinutes: 25
order: 100

objectives:
  - "Navigate the Jenkins dashboard through the embedded UI tab"
  - "Create a freestyle project using the New Item wizard"
  - "Configure an Execute Shell build step via the GUI"
  - "Trigger a build and confirm it succeeds"

instructions: |
  ## Your First Jenkins Job (GUI)

  **Scenario**
  You've just been handed a fresh Jenkins server. Before the rest of the team can use it, you need to prove the basics work: log in, create a simple freestyle job, and confirm it builds successfully. Everything is done through the Jenkins web interface — no command line needed.

  **Your task:** create a freestyle job named `hello-world` with an Execute Shell build step, then run it until it turns green.

  **What You'll Deliver**
  - A freestyle job named exactly `hello-world` visible on the Jenkins dashboard
  - An Execute Shell build step containing exactly: `echo "Hello from Jenkins!"`
  - At least one successful build of the `hello-world` job (blue ball in Build History)

  > ⏳ **Jenkins takes 60–90 seconds to boot.** Click the **UI** tab — if it shows a spinner, wait for it to load automatically. Do not reset the sandbox; just wait.

  **Credentials**
  - Username: `admin`
  - Password: `admin`

  ## Steps

  1. Click the **UI** tab at the top of the workspace to open the Jenkins dashboard.
  2. Log in with `admin` / `admin`.
  3. From the dashboard click **"New Item"** in the left sidebar.
  4. Enter `hello-world` as the item name, select **"Freestyle project"**, click **OK**.
  5. Scroll to the **Build Steps** section, click **"Add build step"** → **"Execute shell"**.
  6. In the command box enter exactly: `echo "Hello from Jenkins!"`
  7. Click **"Save"**.
  8. On the job page click **"Build Now"** in the left sidebar.
  9. Watch the **Build History** panel — wait for the ball to turn **blue** (success).
  10. Click **"Verify Objectives"** below to confirm all three checks pass.

tasks:
  - id: "create-job"
    description: "Create a freestyle project named exactly 'hello-world' via New Item"
  - id: "add-build-step"
    description: "Add an Execute shell build step containing: echo \"Hello from Jenkins!\""
  - id: "run-build"
    description: "Trigger at least one successful build of the hello-world job"

image: "jenkins/jenkins:lts-jdk17"
useImageCmd: true
shell: "bash"
env:
  - "JENKINS_OPTS=--prefix=/jenkins"
  - "JAVA_OPTS=-Djenkins.install.runSetupWizard=false"
ports:
  - 8080
uiPath: "/jenkins/"
terminals:
  - name: "Terminal"
    user: "root"
    cwd: "/root"

setupScript: |
  # Write Groovy init script immediately — Jenkins LTS takes 60-90s to boot,
  # so this write reliably arrives before Jenkins reads init.groovy.d.
  mkdir -p /var/jenkins_home/init.groovy.d
  cat > /var/jenkins_home/init.groovy.d/01-admin.groovy << 'GROOVY'
  import jenkins.model.*
  import hudson.security.*

  def instance = Jenkins.getInstance()
  def realm = new HudsonPrivateSecurityRealm(false)
  realm.createAccount("admin", "admin")
  instance.setSecurityRealm(realm)
  def strategy = new FullControlOnceLoggedInAuthorizationStrategy()
  strategy.setAllowAnonymousRead(false)
  instance.setAuthorizationStrategy(strategy)
  instance.save()
  GROOVY

  # Wait for Jenkins to be responsive (up to 3 minutes)
  echo "Waiting for Jenkins to start..."
  for i in $(seq 1 90); do
    HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/jenkins/login 2>/dev/null)
    if [ "$HTTP" = "200" ]; then
      echo "Jenkins is ready (boot took ~$((i * 2))s)"
      break
    fi
    sleep 2
  done

verifyScript: |
  # CHECK: create-job
  if [ -f /var/jenkins_home/jobs/hello-world/config.xml ]; then
    echo "CHECK:create-job:PASS:hello-world job found"
  else
    echo "CHECK:create-job:FAIL:No job named 'hello-world' — use New Item to create a Freestyle project with that exact name"
  fi

  # CHECK: add-build-step
  # Jenkins XML-encodes double quotes as &quot; inside config.xml.
  # Accept both the encoded form (&quot;) and plain form (") so the check is
  # robust across Jenkins versions.
  if [ -f /var/jenkins_home/jobs/hello-world/config.xml ] && \
     (grep -q 'echo &quot;Hello from Jenkins!&quot;' /var/jenkins_home/jobs/hello-world/config.xml 2>/dev/null || \
      grep -q 'echo "Hello from Jenkins!"' /var/jenkins_home/jobs/hello-world/config.xml 2>/dev/null); then
    echo 'CHECK:add-build-step:PASS:Execute shell step with the required echo command found'
  else
    echo 'CHECK:add-build-step:FAIL:Add an Execute shell build step with exactly: echo "Hello from Jenkins!" (copy-paste to avoid typos)'
  fi

  # CHECK: run-build — look for any build.xml containing a SUCCESS result
  if find /var/jenkins_home/jobs/hello-world/builds -name "build.xml" 2>/dev/null \
       | xargs grep -l "<result>SUCCESS</result>" 2>/dev/null \
       | grep -q .; then
    echo "CHECK:run-build:PASS:Successful build found"
  else
    echo "CHECK:run-build:FAIL:No successful builds yet — click 'Build Now' and wait for the blue ball before verifying"
  fi

hints:
  - "Jenkins takes 60–90 seconds to boot on first start. The UI tab will load automatically once it's ready — just wait."
  - "Log in with admin / admin. If you see an 'Unlock Jenkins' screen the init script didn't apply — reset the sandbox and try again."
  - "The job name must be exactly 'hello-world' — all lowercase, hyphen, no spaces."
  - "The Execute shell build step is under Build Steps → Add build step → Execute shell. Not 'Build Environment' or 'Post-build Actions'."
  - "After clicking 'Build Now', watch the Build History panel on the left. A grey or red ball means it's still running or failed — wait for blue."
  - "The echo command must match exactly: echo \"Hello from Jenkins!\" — copy-paste from the instructions to avoid typos."
