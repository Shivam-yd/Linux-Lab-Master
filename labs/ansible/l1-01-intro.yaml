# ──────────────────────────────────────────────────────────────────────────────
# Ansible Lab: Ad-hoc Commands & Your First Playbook
# ──────────────────────────────────────────────────────────────────────────────

id: "ansible-intro"
title: "Ansible Basics: Ad-hoc Commands & Your First Playbook"
track: "ansible"
level: 1
category: "Ansible Fundamentals"
difficulty: "beginner"
summary: "Learn the core Ansible workflow — write an inventory, run ad-hoc module commands, then author and execute your first playbook."
estimatedMinutes: 20
order: 100

objectives:
  - "Understand what an inventory file is and why Ansible needs one"
  - "Run ad-hoc commands against a host using the ping and copy modules"
  - "Write a YAML playbook with a name, hosts, and tasks block"
  - "Execute a playbook with ansible-playbook and verify its output"

instructions: |
  ## Ansible Basics: Ad-hoc Commands & Your First Playbook

  **Scenario**
  Your team is adopting Ansible to automate repetitive configuration tasks
  across servers. Before you can automate anything, you need to understand
  Ansible's three building blocks: the **inventory** (which hosts to manage),
  **ad-hoc commands** (one-off tasks run directly from the CLI), and
  **playbooks** (reusable automation written in YAML). This lab walks through
  all three in sequence using your local container as the managed host.

  **Your task:** configure an inventory for `localhost`, use ad-hoc commands
  to verify connectivity and create a file, then write a playbook at
  `/root/work/site.yml` that creates `/root/work/playbook-output.txt`
  containing the text `hello-from-playbook` — and run it.

  The inventory and `ansible.cfg` are already created for you in `/root/work/`.
  All three tasks use `ansible_connection=local` so Ansible manages the
  container itself — no SSH or remote hosts required.

  **What You'll Deliver**
  - `/root/work/ping-output.txt` created by running `ansible local -m ping`,
    containing `"pong"` in the output
  - `/root/work/managed.txt` created by an ad-hoc `copy` module command,
    containing the exact text `managed-by-ansible`
  - `/root/work/site.yml` with `hosts:` and `tasks:` blocks, run with
    `ansible-playbook`, producing `/root/work/playbook-output.txt` containing
    the exact text `hello-from-playbook`

  ## Steps

  1. `cat /root/work/inventory.ini`
  2. `cat /root/work/ansible.cfg`
  3. `ansible local -m ping > /root/work/ping-output.txt`
  4. `cat /root/work/ping-output.txt`
  5. `ansible local -m copy -a "content='managed-by-ansible' dest=/root/work/managed.txt"`
  6. `cat /root/work/managed.txt`
  7. `cat > /root/work/site.yml << 'EOF'`
     `---`
     `- name: My First Playbook`
     `  hosts: local`
     `  gather_facts: false`
     `  tasks:`
     `    - name: Create output file`
     `      copy:`
     `        content: "hello-from-playbook"`
     `        dest: /root/work/playbook-output.txt`
     `EOF`
  8. `ansible-playbook /root/work/site.yml`
  9. `cat /root/work/playbook-output.txt`

tasks:
  - id: "ping_localhost"
    description: "Run ansible -m ping against the local group and save the output to /root/work/ping-output.txt"
  - id: "copy_module"
    description: "Use the ad-hoc copy module to create /root/work/managed.txt containing the text managed-by-ansible"
  - id: "first_playbook"
    description: "Write /root/work/site.yml with hosts: and tasks: blocks, run it with ansible-playbook, producing /root/work/playbook-output.txt containing hello-from-playbook"

image: "cytopia/ansible:latest"
entrypoint: ["sleep", "infinity"]
shell: "sh"
terminals:
  - name: "Terminal"
    user: "root"
    cwd: "/root/work"

setupScript: |
  mkdir -p /root/work

  # Inventory — one group called 'local' containing localhost with a local connection.
  # ansible_connection=local means Ansible runs tasks directly in this container;
  # no SSH daemon or network is required.
  cat > /root/work/inventory.ini << 'EOF'
  [local]
  localhost ansible_connection=local
  EOF

  # ansible.cfg in the working directory is picked up automatically.
  # Setting inventory here means students don't need to pass -i on every command.
  cat > /root/work/ansible.cfg << 'EOF'
  [defaults]
  inventory     = /root/work/inventory.ini
  host_key_checking    = False
  deprecation_warnings = False
  retry_files_enabled  = False
  EOF

verifyScript: |
  # CHECK: ping_localhost
  if [ -f /root/work/ping-output.txt ] && grep -q '"pong"' /root/work/ping-output.txt; then
    echo "CHECK:ping_localhost:PASS:ping-output.txt exists and contains pong — ad-hoc ping succeeded"
  else
    echo "CHECK:ping_localhost:FAIL:Run: ansible local -m ping > /root/work/ping-output.txt"
  fi

  # CHECK: copy_module
  if [ -f /root/work/managed.txt ] && grep -q 'managed-by-ansible' /root/work/managed.txt; then
    echo "CHECK:copy_module:PASS:/root/work/managed.txt exists with content managed-by-ansible"
  else
    echo "CHECK:copy_module:FAIL:Run: ansible local -m copy -a \"content='managed-by-ansible' dest=/root/work/managed.txt\""
  fi

  # CHECK: first_playbook
  if [ -f /root/work/site.yml ] \
     && grep -q 'hosts:' /root/work/site.yml \
     && grep -q 'tasks:' /root/work/site.yml \
     && [ -f /root/work/playbook-output.txt ] \
     && grep -q 'hello-from-playbook' /root/work/playbook-output.txt; then
    echo "CHECK:first_playbook:PASS:site.yml written and executed — playbook-output.txt contains hello-from-playbook"
  else
    echo "CHECK:first_playbook:FAIL:Write /root/work/site.yml with hosts: and tasks:, then: ansible-playbook /root/work/site.yml"
  fi

hints:
  - "The inventory is already at /root/work/inventory.ini with a [local] group. Run: ansible local -m ping to test it."
  - "Ansible ad-hoc syntax: ansible <group> -m <module> -a \"<arguments>\". The copy module takes content= and dest=."
  - "Redirect the ping output: ansible local -m ping > /root/work/ping-output.txt"
  - "A minimal playbook needs three keys: hosts: (which group), gather_facts: false (skip slow fact collection), and tasks: (list of modules to run)."
  - "Run your playbook with: ansible-playbook /root/work/site.yml"
  - |
    Full playbook:
    ---
    - name: My First Playbook
      hosts: local
      gather_facts: false
      tasks:
        - name: Create output file
          copy:
            content: "hello-from-playbook"
            dest: /root/work/playbook-output.txt
