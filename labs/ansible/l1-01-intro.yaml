# ──────────────────────────────────────────────────────────────────────────────
# Ansible Lab: Provision a Web Application Server
# ──────────────────────────────────────────────────────────────────────────────

id: "ansible-intro"
title: "Ansible Basics: Provision a Web Application Server"
track: "ansible"
level: 1
category: "Ansible Fundamentals"
difficulty: "beginner"
summary: "Play the role of a new DevOps engineer on your first day. Verify server connectivity, deploy a production environment file, then write a provisioning playbook that sets up the application directory structure."
estimatedMinutes: 25
order: 100

objectives:
  - "Verify managed-host connectivity before running any automation"
  - "Use an ad-hoc Ansible command to deploy a config file to a remote path"
  - "Write and run a playbook that creates a directory and drops in a config file"

instructions: |
  ## Provision a Web Application Server

  **Scenario**
  It's your first week as a DevOps engineer. Your team uses Ansible to manage
  server configuration. The lead engineer has given you three tasks before you
  can deploy the new web application to the `webservers` group:

  1. **Verify connectivity** — always ping the inventory before running any
     automation. It catches misconfigured hosts before a real rollout fails
     halfway through.

  2. **Deploy the environment file** — the application reads its runtime
     settings from `/opt/webapp/.env`. Use an ad-hoc command to push
     `APP_ENV=production` to that path now, before the playbook run.

  3. **Write the provisioning playbook** — the application expects
     `/opt/webapp/` to exist and `/opt/webapp/config.yml` to be present
     containing `debug: false`. Write `provision.yml` and run it.

  The inventory and `ansible.cfg` are already in `/root/work/`.
  `ansible_connection=local` is set so Ansible manages this container
  directly — no SSH or external network is needed.

  **What You'll Deliver**
  - `/root/work/ping-output.txt` — output of `ansible webservers -m ping`,
    containing `"pong"`
  - `/opt/webapp/.env` — created by an ad-hoc `copy` command,
    containing the exact text `APP_ENV=production`
  - `/root/work/provision.yml` — a playbook with `hosts:` and `tasks:` blocks
  - `/opt/webapp/config.yml` — created by running `provision.yml`,
    containing the exact text `debug: false`

  ## Steps

  1. `cat /root/work/inventory.ini`
  2. `ansible webservers -m ping > /root/work/ping-output.txt`
  3. `cat /root/work/ping-output.txt`
  4. `ansible webservers -m copy -a "content='APP_ENV=production' dest=/opt/webapp/.env"`
  5. `cat /opt/webapp/.env`
  6. `cat > /root/work/provision.yml << 'EOF'`
     `---`
     `- name: Provision webapp server`
     `  hosts: webservers`
     `  gather_facts: false`
     `  tasks:`
     `    - name: Ensure webapp directory exists`
     `      file:`
     `        path: /opt/webapp`
     `        state: directory`
     `        mode: "0755"`
     `    - name: Deploy application config`
     `      copy:`
     `        content: "debug: false"`
     `        dest: /opt/webapp/config.yml`
     `EOF`
  7. `ansible-playbook /root/work/provision.yml`
  8. `cat /opt/webapp/config.yml`

tasks:
  - id: "verify_connectivity"
    description: "Run ansible webservers -m ping and save the output to /root/work/ping-output.txt"
  - id: "deploy_env_file"
    description: "Use an ad-hoc copy command to create /opt/webapp/.env containing APP_ENV=production"
  - id: "provision_webapp"
    description: "Write /root/work/provision.yml with hosts: and tasks: blocks, run it, producing /opt/webapp/config.yml containing debug: false"

image: "cytopia/ansible:latest"
entrypoint: ["sleep", "infinity"]
shell: "sh"
terminals:
  - name: "Terminal"
    user: "root"
    cwd: "/root/work"

setupScript: |
  mkdir -p /root/work /opt/webapp

  # Inventory — 'webservers' group with localhost using a local connection.
  # In a real environment this file would list actual server IPs or hostnames.
  # ansible_connection=local makes Ansible run tasks directly in this container.
  cat > /root/work/inventory.ini << 'EOF'
  [webservers]
  localhost ansible_connection=local
  EOF

  # ansible.cfg sets the default inventory path so students don't need -i.
  cat > /root/work/ansible.cfg << 'EOF'
  [defaults]
  inventory            = /root/work/inventory.ini
  host_key_checking    = False
  deprecation_warnings = False
  retry_files_enabled  = False
  EOF

verifyScript: |
  # CHECK: verify_connectivity
  if [ -f /root/work/ping-output.txt ] && grep -q '"pong"' /root/work/ping-output.txt; then
    echo "CHECK:verify_connectivity:PASS:ping-output.txt exists and webservers responded with pong"
  else
    echo "CHECK:verify_connectivity:FAIL:Run: ansible webservers -m ping > /root/work/ping-output.txt"
  fi

  # CHECK: deploy_env_file
  if [ -f /opt/webapp/.env ] && grep -q 'APP_ENV=production' /opt/webapp/.env; then
    echo "CHECK:deploy_env_file:PASS:/opt/webapp/.env contains APP_ENV=production"
  else
    echo "CHECK:deploy_env_file:FAIL:Run: ansible webservers -m copy -a \"content='APP_ENV=production' dest=/opt/webapp/.env\""
  fi

  # CHECK: provision_webapp
  if [ -f /root/work/provision.yml ] \
     && grep -q 'hosts:' /root/work/provision.yml \
     && grep -q 'tasks:' /root/work/provision.yml \
     && [ -f /opt/webapp/config.yml ] \
     && grep -q 'debug: false' /opt/webapp/config.yml; then
    echo "CHECK:provision_webapp:PASS:provision.yml written and executed — /opt/webapp/config.yml contains debug: false"
  else
    echo "CHECK:provision_webapp:FAIL:Write /root/work/provision.yml with hosts: and tasks:, then: ansible-playbook /root/work/provision.yml"
  fi

hints:
  - "Always verify connectivity before automating: ansible webservers -m ping"
  - "Ad-hoc copy syntax: ansible webservers -m copy -a \"content='VALUE' dest=/path/to/file\""
  - "The /opt/webapp/ directory is pre-created for you so the copy command works without needing the file module first."
  - "A playbook must have at minimum: a name, hosts: (which group), and tasks: (list of modules). gather_facts: false skips slow fact collection."
  - "The file module manages directories: state: directory creates the path if it does not exist."
  - |
    Minimal provision.yml:
    ---
    - name: Provision webapp server
      hosts: webservers
      gather_facts: false
      tasks:
        - name: Ensure webapp directory exists
          file:
            path: /opt/webapp
            state: directory
        - name: Deploy application config
          copy:
            content: "debug: false"
            dest: /opt/webapp/config.yml
