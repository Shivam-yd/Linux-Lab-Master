# ──────────────────────────────────────────────────────────────────────────────
# Docker Lab: Images 101 — Pull, List, Inspect, Remove
# ──────────────────────────────────────────────────────────────────────────────

id: "docker-images-basics"
title: "Docker Images 101: Pull, List, Inspect, Remove"
track: "docker"
level: 1
category: "Docker Fundamentals"
difficulty: "beginner"
summary: "Learn what a Docker image is and manage the local image cache with pull, images, inspect, and rmi."
estimatedMinutes: 15
order: 100

objectives:
  - "Explain the difference between an image and a container"
  - "Download images into the local cache with docker pull"
  - "List cached images with docker images"
  - "Remove an image you no longer need with docker rmi"

instructions: |
  ## Docker Images 101: Pull, List, Inspect, Remove

  **Scenario**
  A teammate just handed you a list of images to prepare for a demo
  environment. You need to pull two images into the local cache, verify
  what's there, then remove the one that isn't needed for the demo so the
  host doesn't fill up with unused images.

  **Your task:** pull `busybox` and `nginx` into the local image cache, then
  remove `busybox` to clean up.

  This sandbox runs a **real Docker daemon** — commands behave exactly as they
  would on any Linux host.

  **What You'll Deliver**
  - `busybox:latest` pulled into the local image cache
  - `nginx:latest` pulled and still present in the cache
  - `busybox:latest` removed with `docker rmi`, leaving only `nginx:latest`

  ## Steps

  1. Pull busybox: `docker pull busybox`
  2. Pull nginx: `docker pull nginx`
  3. List the cache to see both images: `docker images`
  4. Inspect nginx to see its metadata: `docker inspect nginx`
  5. Remove busybox: `docker rmi busybox`
  6. `docker images`

tasks:
  - id: "pulled_busybox"
    description: "Pull the busybox image with docker pull"
  - id: "pulled_nginx"
    description: "Pull the nginx image so it appears in docker images"
  - id: "removed_busybox"
    description: "Remove the busybox image with docker rmi, leaving nginx in the cache"

image: "docker:dind"
privileged: true
entrypoint: ["sleep", "infinity"]
shell: "sh"
terminals:
  - name: "Terminal"
    user: "root"
    cwd: "/root/work"

setupScript: |
  dockerd &>/tmp/dockerd.log &
  timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 0.5; done'
  mkdir -p /var/log /root/work
  docker events --format '{{.Type}}:{{.Action}}:{{.Actor.Attributes.name}}' > /var/log/docker-events.log &

verifyScript: |
  # CHECK: pulled_busybox
  if grep -q 'image:pull:busybox' /var/log/docker-events.log 2>/dev/null; then
    echo "CHECK:pulled_busybox:PASS:busybox was pulled"
  else
    echo "CHECK:pulled_busybox:FAIL:busybox image was never pulled — run: docker pull busybox"
  fi

  # CHECK: pulled_nginx
  if docker image inspect nginx:latest >/dev/null 2>&1; then
    echo "CHECK:pulled_nginx:PASS:nginx:latest is present in the image cache"
  else
    echo "CHECK:pulled_nginx:FAIL:nginx image not found — run: docker pull nginx"
  fi

  # CHECK: removed_busybox
  if ! docker image inspect busybox:latest >/dev/null 2>&1 && docker image inspect nginx:latest >/dev/null 2>&1; then
    echo "CHECK:removed_busybox:PASS:busybox was removed and nginx remains cached"
  else
    echo "CHECK:removed_busybox:FAIL:Run 'docker rmi busybox' after pulling both images"
  fi

hints:
  - "docker pull <image> without a tag defaults to :latest."
  - "docker images shows every image currently in your local cache."
  - "docker rmi <image> only works if no container is currently using that image."
  - "Pull busybox, pull nginx, THEN remove busybox — the cache should end with only nginx."
