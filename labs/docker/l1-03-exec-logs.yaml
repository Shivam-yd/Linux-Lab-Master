# ──────────────────────────────────────────────────────────────────────────────
# Docker Lab: Logs & Exec — Talking to a Running Container
# ──────────────────────────────────────────────────────────────────────────────

id: "docker-exec-logs"
title: "Logs & Exec: Talking to a Running Container"
track: "docker"
level: 1
category: "Docker Fundamentals"
difficulty: "beginner"
summary: "Inspect a running container's output with docker logs and run one-off commands inside it with docker exec."
estimatedMinutes: 15
order: 300

objectives:
  - "Read a container's output with docker logs"
  - "Run an extra command inside an already-running container with docker exec"
  - "Understand that exec runs a NEW process inside a container that already exists"

instructions: |
  ## Logs & Exec: Talking to a Running Container

  **Scenario**
  A container is running in your environment and something looks off. You
  need to check its output without stopping it, then run a one-off diagnostic
  command inside it — again without interrupting the main process. This is
  the bread-and-butter of live container debugging.

  **Your task:** start a container named `logger` using the `busybox` image
  in detached mode so it keeps producing output. Read its output with
  `docker logs`, then use `docker exec` to create the file `/exec-proof.txt`
  inside the container containing the text `reached-via-exec` — without
  stopping `logger` first.

  This sandbox runs a **real Docker daemon**.

  **What You'll Deliver**
  - Container named `logger` (image: `busybox`) running and producing `tick` lines in `docker logs logger`
  - `/exec-proof.txt` inside the `logger` container containing `reached-via-exec`, created via `docker exec` while `logger` stayed running

  ## Steps

  1. Start logger in the background:
     `docker run -d --name logger busybox sh -c 'while true; do echo tick; sleep 1; done'`
  2. Read its output: `docker logs logger` — you should see one or more `tick` lines
  3. While logger is still running, create the proof file inside it:
     `docker exec logger sh -c 'echo reached-via-exec > /exec-proof.txt'`
  4. Confirm logger is still running: `docker ps`
  5. Confirm the file exists inside the container:
     `docker exec logger cat /exec-proof.txt`

tasks:
  - id: "logger_running_with_output"
    description: "Container logger is running and docker logs shows its ticking output"
  - id: "exec_proof_created"
    description: "docker exec was used against logger to create /exec-proof.txt containing 'reached-via-exec'"

image: "docker:dind"
privileged: true
entrypoint: ["sleep", "infinity"]
shell: "sh"
terminals:
  - name: "Terminal"
    user: "root"
    cwd: "/root/work"

setupScript: |
  dockerd &>/tmp/dockerd.log &
  timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 0.5; done'
  docker events --format '{{.Type}}:{{.Action}}:{{.Actor.Attributes.name}}' > /var/log/docker-events.log &
  mkdir -p /root/work
  docker pull busybox >/dev/null 2>&1

verifyScript: |
  # CHECK: logger_running_with_output
  if docker inspect logger --format '{{.State.Running}}' 2>/dev/null | grep -q 'true' \
     && docker logs logger 2>/dev/null | grep -q 'tick'; then
    echo "CHECK:logger_running_with_output:PASS:logger is running and producing output"
  else
    echo "CHECK:logger_running_with_output:FAIL:Start logger: docker run -d --name logger busybox sh -c 'while true; do echo tick; sleep 1; done'"
  fi

  # CHECK: exec_proof_created
  if docker inspect logger --format '{{.State.Running}}' 2>/dev/null | grep -q 'true' \
     && docker exec logger test -f /exec-proof.txt 2>/dev/null \
     && docker exec logger grep -q 'reached-via-exec' /exec-proof.txt 2>/dev/null; then
    echo "CHECK:exec_proof_created:PASS:exec-proof.txt was created via docker exec while logger stayed running"
  else
    echo "CHECK:exec_proof_created:FAIL:Use docker exec logger sh -c 'echo reached-via-exec > /exec-proof.txt', and keep logger running"
  fi

hints:
  - "docker logs only shows past output — it won't stream new lines unless you add -f (not needed here)."
  - "docker exec <name> <cmd> requires the container to already be running via docker run -d."
  - "docker exec logger sh -c 'echo reached-via-exec > /exec-proof.txt'"
  - "Verify with: docker exec logger cat /exec-proof.txt"
