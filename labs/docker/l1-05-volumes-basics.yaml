# ──────────────────────────────────────────────────────────────────────────────
# Docker Lab: Persisting Data with Volumes
# ──────────────────────────────────────────────────────────────────────────────

id: "docker-volumes-basics"
title: "Persisting Data with Volumes"
track: "docker"
level: 1
category: "Docker Fundamentals"
difficulty: "beginner"
summary: "Create a named volume, write data to it from one container, and read it back from a completely different container."
estimatedMinutes: 15
order: 500

objectives:
  - "Create a named volume with docker volume create"
  - "Mount a volume into a container with docker run -v"
  - "Prove data written to a volume survives container removal and recreation"

instructions: |
  ## Persisting Data with Volumes

  **Scenario**
  Your app generates data that must survive container restarts and replacements.
  Containers are disposable — their own filesystem disappears when you remove
  them. A named volume is separate, durable storage managed by Docker that
  outlives any single container, so the next container picks up exactly where
  the last one left off.

  **Your task:** create a named volume called `appdata`, run a `busybox`
  container named `writer` that writes the text `written-by-writer` to the file
  `/data/note.txt` inside the volume, remove that container, then run a second
  `busybox` container named `reader` that appends the text `read-by-reader` to
  the same `/data/note.txt`, and remove it too — proving the file survived both
  container lifetimes.

  This sandbox runs a **real Docker daemon**.

  **What You'll Deliver**
  - Named volume `appdata` created
  - `writer` container wrote `written-by-writer` to `/data/note.txt` on the volume, then removed
  - `reader` container appended `read-by-reader` to the same `/data/note.txt`, then removed

  ## Steps

  1. Create the volume: `docker volume create appdata`
  2. Confirm it exists: `docker volume ls`
  3. Run the writer:
     `docker run --name writer -v appdata:/data busybox sh -c "echo written-by-writer > /data/note.txt"`
  4. Remove the writer: `docker rm writer`
  5. Run the reader:
     `docker run --name reader -v appdata:/data busybox sh -c "echo read-by-reader >> /data/note.txt"`
  6. Remove the reader: `docker rm reader`

tasks:
  - id: "volume_created"
    description: "Named volume appdata created (docker volume create appdata)"
  - id: "written_by_writer"
    description: "busybox container named writer wrote written-by-writer to /data/note.txt on the appdata volume, then was removed"
  - id: "read_by_reader"
    description: "busybox container named reader appended read-by-reader to /data/note.txt on the same appdata volume, then was removed"

image: "docker:dind"
privileged: true
entrypoint: ["sleep", "infinity"]
shell: "sh"
terminals:
  - name: "Terminal"
    user: "root"
    cwd: "/root/work"

setupScript: |
  dockerd &>/tmp/dockerd.log &
  timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 0.5; done'
  docker events --format '{{.Type}}:{{.Action}}:{{.Actor.Attributes.name}}' > /var/log/docker-events.log &
  mkdir -p /root/work
  docker pull busybox >/dev/null 2>&1

verifyScript: |
  # CHECK: volume_created
  if docker volume inspect appdata >/dev/null 2>&1; then
    echo "CHECK:volume_created:PASS:appdata volume exists"
  else
    echo "CHECK:volume_created:FAIL:Run: docker volume create appdata"
  fi

  # CHECK: written_by_writer
  MOUNTPOINT=$(docker volume inspect appdata --format '{{.Mountpoint}}' 2>/dev/null)
  if [ -f "$MOUNTPOINT/note.txt" ] && grep -q "written-by-writer" "$MOUNTPOINT/note.txt" \
     && ! docker inspect writer >/dev/null 2>&1; then
    echo "CHECK:written_by_writer:PASS:writer wrote to the volume and was removed"
  else
    echo "CHECK:written_by_writer:FAIL:Run the writer container then: docker rm writer"
  fi

  # CHECK: read_by_reader
  if [ -f "$MOUNTPOINT/note.txt" ] \
     && grep -q "written-by-writer" "$MOUNTPOINT/note.txt" \
     && grep -q "read-by-reader" "$MOUNTPOINT/note.txt" \
     && ! docker inspect reader >/dev/null 2>&1; then
    echo "CHECK:read_by_reader:PASS:reader saw the writer's data and appended its own, proving the volume persisted"
  else
    echo "CHECK:read_by_reader:FAIL:Run the reader container then: docker rm reader"
  fi

hints:
  - "docker volume create <name> makes storage that outlives any single container."
  - "-v appdata:/data mounts the volume at /data inside the container's filesystem."
  - "Use image busybox for both containers — it is small and has sh built in."
  - "Remove writer before starting reader so you can see the data really came from the volume, not the old container."
