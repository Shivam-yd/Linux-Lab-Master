# ──────────────────────────────────────────────────────────────────────────────
# Docker Lab: Sharing Data Between Containers with Volumes
# ──────────────────────────────────────────────────────────────────────────────

id: "docker-volume-sharing"
title: "Sharing Data Between Containers with Volumes"
track: "docker"
level: 1
category: "Docker Fundamentals"
difficulty: "beginner"
summary: "Use a named volume to pass data from a writer container to a reader container, proving persistence across container lifetimes."
estimatedMinutes: 20
order: 800

objectives:
  - "Create a named volume with docker volume create"
  - "Mount the same volume in two separate containers with -v"
  - "Prove that data written by one container is readable by another"
  - "Understand why volumes outlive the containers that use them"

instructions: |
  ## Sharing Data Between Containers with Volumes

  **Scenario**
  Your reporting pipeline runs in two stages: a generator container that writes
  a CSV report, and an archiver container that picks it up. Both containers are
  ephemeral — they start, do their work, and exit. The shared storage between
  them must survive both container lifecycles. A named Docker volume is the
  standard solution: it exists independently of any container and can be mounted
  by as many containers as needed.

  **Your task:** create a named volume called `report-data`, run a `busybox`
  container named `writer` that writes two lines (`monthly-report-2024` and
  `status: complete`) to `/data/report.txt` inside the volume, then run a second
  `busybox` container named `reader` that reads `/data/report.txt` from the same
  volume and saves its contents to `/root/work/read-confirm.txt` on the host.

  This sandbox runs a **real Docker daemon**.

  **What You'll Deliver**
  - Named volume `report-data` created
  - `writer` container created `/data/report.txt` on the volume containing the exact lines `monthly-report-2024` and `status: complete`
  - `reader` container produced `/root/work/read-confirm.txt` by reading from the same volume

  ## Steps

  1. Create the volume: `docker volume create report-data`
  2. Verify it exists: `docker volume ls`
  3. Run the writer:
     `docker run --name writer -v report-data:/data busybox sh -c "echo 'monthly-report-2024' > /data/report.txt && echo 'status: complete' >> /data/report.txt"`
  4. Confirm the writer exited: `docker ps -a`
  5. Run the reader — mount the volume AND bind-mount /root/work so the output lands on the host:
     `docker run --name reader -v report-data:/data -v /root/work:/root/work busybox sh -c "cat /data/report.txt > /root/work/read-confirm.txt"`
  6. Verify the output: `cat /root/work/read-confirm.txt`

tasks:
  - id: "volume_created"
    description: "Named volume report-data exists"
  - id: "writer_wrote_data"
    description: "writer container ran and wrote report.txt to the report-data volume"
  - id: "reader_confirmed"
    description: "reader container ran and produced /root/work/read-confirm.txt"

image: "docker:dind"
privileged: true
entrypoint: ["sleep", "infinity"]
shell: "bash"
terminals:
  - name: "Terminal"
    user: "root"
    cwd: "/root/work"

setupScript: |
  dockerd &>/tmp/dockerd.log &
  timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 0.5; done'
  mkdir -p /var/log
  docker events --format '{{.Type}}:{{.Action}}:{{.Actor.Attributes.name}}' > /var/log/docker-events.log &
  mkdir -p /root/work
  docker pull busybox >/dev/null 2>&1

verifyScript: |
  # CHECK: volume_created
  if docker volume inspect report-data >/dev/null 2>&1; then
    echo "CHECK:volume_created:PASS:report-data volume exists"
  else
    echo "CHECK:volume_created:FAIL:Volume not found — run: docker volume create report-data"
  fi

  # CHECK: writer_wrote_data
  MOUNTPOINT=$(docker volume inspect report-data --format '{{.Mountpoint}}' 2>/dev/null)
  if [ -f "$MOUNTPOINT/report.txt" ] && grep -q "monthly-report-2024" "$MOUNTPOINT/report.txt"; then
    echo "CHECK:writer_wrote_data:PASS:report.txt written to report-data volume by writer container"
  else
    echo "CHECK:writer_wrote_data:FAIL:report.txt not found in volume — run the writer container with -v report-data:/data"
  fi

  # CHECK: reader_confirmed
  if [ -f /root/work/read-confirm.txt ] && [ -s /root/work/read-confirm.txt ]; then
    echo "CHECK:reader_confirmed:PASS:/root/work/read-confirm.txt created by the reader container"
  else
    echo "CHECK:reader_confirmed:FAIL:/root/work/read-confirm.txt missing — run the reader with both -v report-data:/data and -v /root/work:/root/work"
  fi

hints:
  - "docker volume create report-data creates the volume. -v report-data:/data mounts it into the container at /data."
  - "The writer and reader mount the SAME volume name — that's how data flows between them."
  - "The reader needs -v /root/work:/root/work so it can write read-confirm.txt to the host filesystem."
  - "docker ps -a shows both containers after they exit — exited status is normal for one-shot containers."
