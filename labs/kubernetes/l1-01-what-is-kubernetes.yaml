id: "kubernetes-what-is-k8s"
title: "What is Kubernetes?"
track: "kubernetes"
level: 1
category: "Kubernetes Fundamentals"
difficulty: "beginner"
summary: "Query a simulated cluster with the real kubectl binary, identify ready worker nodes and system components, and write your first Pod manifest."
estimatedMinutes: 20
order: 100

objectives:
  - "Run kubectl get nodes and read node roles and status"
  - "Run kubectl get pods to locate the namespace where Kubernetes' own components run"
  - "Write a valid Pod manifest with required fields and a label"

instructions: |
  ## What is Kubernetes?

  **Scenario**
  A maintenance window starts in 30 minutes. You have `kubectl` access to a production cluster. Your lead needs three things fast: how many worker nodes are Ready, which namespace Kubernetes' own system components live in, and a Pod manifest ready to apply the moment the window opens.

  **Your task:** query the cluster with `kubectl`, write the worker node count and system namespace to output files, and create the Pod manifest for `web-probe`.

  **What You'll Deliver**
  - `/root/ready-nodes.txt` containing the count of Ready worker nodes
  - `/root/system-namespace.txt` containing the name of the namespace where system components run
  - `/root/web-probe.yaml` written as a Pod manifest named `web-probe`, image `nginx:alpine`, label `env: staging`

  ## Steps

  1. `kubectl get nodes`
  2. `echo "2" > /root/ready-nodes.txt`
  3. `kubectl get pods -A`
  4. `echo "kube-system" > /root/system-namespace.txt`
  5. Create the Pod manifest:

     ```
     cat > /root/web-probe.yaml <<'EOF'
     apiVersion: v1
     kind: Pod
     metadata:
       name: web-probe
       labels:
         env: staging
     spec:
       containers:
         - name: web
           image: nginx:alpine
     EOF
     ```
  6. `kubectl apply -f /root/web-probe.yaml`

tasks:
  - id: "ready-worker-nodes"
    description: "Write the number of worker nodes in Ready state to /root/ready-nodes.txt"
  - id: "system-namespace"
    description: "Write the namespace where Kubernetes system components run to /root/system-namespace.txt"
  - id: "write-pod-manifest"
    description: "Create /root/web-probe.yaml — a Pod manifest named web-probe, image nginx:alpine, with label env: staging"

image: "alpine/k8s:1.30.2"
shell: "sh"
terminals:
  - name: "Terminal"
    user: "root"
    cwd: "/root"

setupScript: |
  # Decode and install a kubectl interceptor at /usr/local/bin/kubectl (takes
  # PATH priority over the real binary at /usr/bin/kubectl).
  # The interceptor serves pre-seeded cluster data for read commands so the lab
  # works without a live API server, and simulates `apply` by parsing the manifest.
  # All other commands pass through to the real kubectl at /usr/bin/kubectl.
  echo "" | base64 -d > /usr/local/bin/kubectl
  chmod +x /usr/local/bin/kubectl

verifyScript: |
  # CHECK: ready-worker-nodes
  if [ -f /root/ready-nodes.txt ] && grep -q "2" /root/ready-nodes.txt; then
    echo "CHECK:ready-worker-nodes:PASS:Correct — 2 worker nodes are in Ready state"
  else
    echo "CHECK:ready-worker-nodes:FAIL:/root/ready-nodes.txt missing or incorrect — run kubectl get nodes and count rows where ROLES is <none> and STATUS is Ready"
  fi

  # CHECK: system-namespace
  if [ -f /root/system-namespace.txt ] && grep -qi "kube-system" /root/system-namespace.txt; then
    echo "CHECK:system-namespace:PASS:Correct — kube-system is where Kubernetes' own components run"
  else
    echo "CHECK:system-namespace:FAIL:/root/system-namespace.txt missing or incorrect — run kubectl get pods -A and look at the NAMESPACE column"
  fi

  # CHECK: write-pod-manifest
  if [ -f /root/web-probe.yaml ] \
    && grep -q "kind: Pod" /root/web-probe.yaml \
    && grep -q "name: web-probe" /root/web-probe.yaml \
    && grep -q "nginx:alpine" /root/web-probe.yaml \
    && grep -q "env: staging" /root/web-probe.yaml; then
    echo "CHECK:write-pod-manifest:PASS:Valid Pod manifest — name, image, and label all present"
  else
    echo "CHECK:write-pod-manifest:FAIL:/root/web-probe.yaml missing or incomplete — must have kind: Pod, name: web-probe, image: nginx:alpine, and label env: staging"
  fi

hints:
  - "Run `kubectl get nodes` — the ROLES column tells you which is the control plane and which are workers."
  - "Count the rows where ROLES is `<none>` and STATUS is `Ready` — those are your worker nodes."
  - "Run `kubectl get pods -A` and look at the NAMESPACE column — all system component pods share one namespace."
  - "A Pod manifest needs four things at minimum: `apiVersion: v1`, `kind: Pod`, `metadata.name`, and `spec.containers`. Add your label under `metadata.labels`."
