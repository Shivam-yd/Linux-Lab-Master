id: "kubernetes-what-is-k8s"
title: "What is Kubernetes?"
track: "kubernetes"
level: 1
category: "Kubernetes Fundamentals"
difficulty: "beginner"
summary: "Explore a cluster state snapshot, identify ready worker nodes and system components, and write your first Pod manifest."
estimatedMinutes: 20
order: 100

objectives:
  - "Read kubectl-style output to identify node roles and status"
  - "Locate the namespace where Kubernetes' own components run"
  - "Write a valid Pod manifest with required fields and a label"

instructions: |
  ## What is Kubernetes?

  **Scenario**
  Before a maintenance window your team exported a snapshot of the production cluster. The files are under `/root/cluster/`. Your lead needs three things before the window opens: how many worker nodes are currently Ready, the name of the namespace where Kubernetes' own system components live, and a Pod manifest for the new health-check probe the team wants to deploy after maintenance.

  **Your task:** explore the cluster snapshot files, record the count of Ready worker nodes and the system namespace, then write a Pod manifest named `web-probe` using `nginx:alpine` with the label `env: staging`.

  **What You'll Deliver**
  - `/root/ready-nodes.txt` — number of worker nodes in Ready state
  - `/root/system-namespace.txt` — namespace where Kubernetes system components run
  - `/root/web-probe.yaml` — Pod manifest with `name: web-probe`, image `nginx:alpine`, and label `env: staging`

  ## Steps

  1. `cat /root/cluster/nodes.txt` — read the node list; count workers (role `<none>`) with status `Ready`
  2. Write the count: `echo "2" > /root/ready-nodes.txt`
  3. `cat /root/cluster/system-pods.txt` — find which namespace the system pods live in
  4. Write the namespace: `echo "kube-system" > /root/system-namespace.txt`
  5. Create the Pod manifest:
     ```
     cat > /root/web-probe.yaml <<'EOF'
     apiVersion: v1
     kind: Pod
     metadata:
       name: web-probe
       labels:
         env: staging
     spec:
       containers:
         - name: web
           image: nginx:alpine
     EOF
     ```
  6. Confirm it looks right: `cat /root/web-probe.yaml`

tasks:
  - id: "ready-worker-nodes"
    description: "Write the number of worker nodes in Ready state to /root/ready-nodes.txt"
  - id: "system-namespace"
    description: "Write the namespace where Kubernetes system components run to /root/system-namespace.txt"
  - id: "write-pod-manifest"
    description: "Create /root/web-probe.yaml — a Pod manifest named web-probe, image nginx:alpine, with label env: staging"

image: "alpine:latest"
shell: "sh"
terminals:
  - name: "Terminal"
    user: "root"
    cwd: "/root"

setupScript: |
  mkdir -p /root/cluster

  cat > /root/cluster/nodes.txt <<'EOF'
  NAME                STATUS   ROLES           AGE   VERSION
  control-plane-1     Ready    control-plane   42d   v1.30.2
  worker-node-1       Ready    <none>          42d   v1.30.2
  worker-node-2       Ready    <none>          42d   v1.30.2
  EOF

  cat > /root/cluster/system-pods.txt <<'EOF'
  NAMESPACE     NAME                                    READY   STATUS    RESTARTS
  kube-system   coredns-7db6d8ff4d-4xk9z                1/1     Running   0
  kube-system   coredns-7db6d8ff4d-mwt8p                1/1     Running   0
  kube-system   etcd-control-plane-1                    1/1     Running   0
  kube-system   kube-apiserver-control-plane-1          1/1     Running   0
  kube-system   kube-controller-manager-control-plane-1 1/1     Running   0
  kube-system   kube-proxy-2fhgq                        1/1     Running   0
  kube-system   kube-proxy-9xbkr                        1/1     Running   0
  kube-system   kube-scheduler-control-plane-1          1/1     Running   0
  EOF

verifyScript: |
  # CHECK: ready-worker-nodes
  if [ -f /root/ready-nodes.txt ] && grep -q "2" /root/ready-nodes.txt; then
    echo "CHECK:ready-worker-nodes:PASS:Correct — 2 worker nodes are in Ready state"
  else
    echo "CHECK:ready-worker-nodes:FAIL:/root/ready-nodes.txt missing or incorrect — check /root/cluster/nodes.txt and count the Ready workers (role <none>)"
  fi

  # CHECK: system-namespace
  if [ -f /root/system-namespace.txt ] && grep -qi "kube-system" /root/system-namespace.txt; then
    echo "CHECK:system-namespace:PASS:Correct — kube-system is where Kubernetes' own components run"
  else
    echo "CHECK:system-namespace:FAIL:/root/system-namespace.txt missing or incorrect — check /root/cluster/system-pods.txt for the NAMESPACE column"
  fi

  # CHECK: write-pod-manifest
  if [ -f /root/web-probe.yaml ] \
    && grep -q "kind: Pod" /root/web-probe.yaml \
    && grep -q "name: web-probe" /root/web-probe.yaml \
    && grep -q "nginx:alpine" /root/web-probe.yaml \
    && grep -q "env: staging" /root/web-probe.yaml; then
    echo "CHECK:write-pod-manifest:PASS:Valid Pod manifest — name, image, and label all present"
  else
    echo "CHECK:write-pod-manifest:FAIL:/root/web-probe.yaml missing or incomplete — must have kind: Pod, name: web-probe, image: nginx:alpine, and label env: staging"
  fi

hints:
  - "Start with `cat /root/cluster/nodes.txt` — the ROLES column tells you which is the control plane and which are workers."
  - "Count the rows where ROLES is `<none>` and STATUS is `Ready` — that's your worker count."
  - "Run `cat /root/cluster/system-pods.txt` and look at the NAMESPACE column — all system component pods share one namespace."
  - "A Pod manifest needs four things at minimum: `apiVersion: v1`, `kind: Pod`, `metadata.name`, and `spec.containers`. Add your label under `metadata.labels`."
