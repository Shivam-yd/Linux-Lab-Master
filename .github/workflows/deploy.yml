name: Deploy Linux Lab

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Remove old repository
        run: sudo rm -rf /opt/Linux-Lab-Master

      - name: Clone latest repository
        run: sudo git clone https://github.com/Shivam-yd/Linux-Lab-Master.git /opt/Linux-Lab-Master

      - name: Fix permissions
        run: sudo chown -R github-runner:github-runner /opt/Linux-Lab-Master

      - name: Build and push images
        run: |
          cd /opt/Linux-Lab-Master
          sudo docker build --target migrate -t localhost:5000/devlabmaster-migrate:${{ github.sha }} .
          sudo docker build --target api    -t localhost:5000/devlabmaster-api:${{ github.sha }}     .
          sudo docker build --target web    -t localhost:5000/devlabmaster-web:${{ github.sha }}     .
          sudo docker push localhost:5000/devlabmaster-migrate:${{ github.sha }}
          sudo docker push localhost:5000/devlabmaster-api:${{ github.sha }}
          sudo docker push localhost:5000/devlabmaster-web:${{ github.sha }}

      - name: Import images into k3s containerd
        run: |
          sudo docker save localhost:5000/devlabmaster-migrate:${{ github.sha }} | sudo k3s ctr images import -
          sudo docker save localhost:5000/devlabmaster-api:${{ github.sha }}     | sudo k3s ctr images import -
          sudo docker save localhost:5000/devlabmaster-web:${{ github.sha }}     | sudo k3s ctr images import -
          echo "--- images in k3s containerd ---"
          sudo k3s ctr images ls | grep devlabmaster

      - name: Run migration
        run: |
          export IMAGE_TAG=${{ github.sha }}
          echo "--- secrets in namespace ---"
          sudo kubectl get secrets -n devlabmaster
          sudo kubectl delete job migrate -n devlabmaster --ignore-not-found=true
          envsubst '${IMAGE_TAG}' < /opt/Linux-Lab-Master/k8s/migrate.yaml | sudo kubectl apply -f -
          sleep 10
          echo "--- all pods in namespace ---"
          sudo kubectl get pods -n devlabmaster
          echo "--- job description ---"
          sudo kubectl describe job/migrate -n devlabmaster
          if ! sudo kubectl wait job/migrate -n devlabmaster --for=condition=complete --timeout=180s; then
            echo "--- namespace events ---"
            sudo kubectl get events -n devlabmaster --sort-by=.metadata.creationTimestamp | tail -30
            echo "--- pod logs ---"
            POD=$(sudo kubectl get pods -n devlabmaster -o name | grep migrate | head -1)
            [ -n "$POD" ] && sudo kubectl logs -n devlabmaster "$POD" --tail=100 || echo "no migrate pod found"
            exit 1
          fi

      - name: Rolling deploy
        run: |
          export IMAGE_TAG=${{ github.sha }}
          envsubst '${IMAGE_TAG}' < /opt/Linux-Lab-Master/k8s/app.yaml | sudo kubectl apply -f -
          sudo kubectl rollout status deployment/api -n devlabmaster --timeout=120s
          sudo kubectl rollout status deployment/web -n devlabmaster --timeout=120s
