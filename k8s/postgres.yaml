apiVersion: v1
kind: Namespace
metadata:
  name: devlabmaster
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devlabmaster
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: devlabmaster
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: linuxlabs
            - name: POSTGRES_DB
              value: linuxlabs
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devlabmaster-env
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "linuxlabs", "-d", "linuxlabs"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
